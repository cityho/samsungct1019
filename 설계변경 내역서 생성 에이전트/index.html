<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>설계변경 도급내역서 생성 에이전트</title>
<style>
:root{--navy:#1F3864;--bg:#f4f6fa;--line:#d9dfea;--up:#c0392b;--down:#1f6fb5;--new:#1e8449}
*{box-sizing:border-box}body{margin:0;font:14px/1.5 "Malgun Gothic",sans-serif;background:var(--bg);color:#222}
header{background:var(--navy);color:#fff;padding:14px 24px}header h1{margin:0;font-size:18px}header small{opacity:.75}
main{max-width:1300px;margin:0 auto;padding:16px 24px 60px}
.card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:14px}
.card h2{margin:0 0 10px;font-size:15px;color:var(--navy)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:900px){.grid{grid-template-columns:1fr}}
label{font-weight:bold;font-size:13px;display:block;margin:8px 0 4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips label{font-weight:normal;margin:0;border:1px solid var(--line);border-radius:14px;padding:2px 10px;cursor:pointer;background:#fafbfd}
.chips input{margin-right:4px}.chips label:has(input:checked){background:#e3ebf8;border-color:var(--navy)}
textarea,input[type=text],input[type=password]{width:100%;padding:8px;border:1px solid var(--line);border-radius:6px;font:inherit}
textarea{min-height:110px}
button{background:var(--navy);color:#fff;border:0;border-radius:6px;padding:9px 18px;font:inherit;cursor:pointer}
button.sec{background:#fff;color:var(--navy);border:1px solid var(--navy);padding:5px 12px}button:disabled{opacity:.5;cursor:wait}
.muted{color:#667;font-size:12px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
table{border-collapse:collapse;width:100%;font-size:12.5px}th,td{border:1px solid var(--line);padding:4px 7px;text-align:left}
th{background:#eef2f9;position:sticky;top:0}td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.scroll{max-height:340px;overflow:auto}
tr.t-수량변경{background:#fff7e0}tr.t-규격변경{background:#e8f1fb}tr.t-삭제{background:#fdeaea}tr.t-신규{background:#e6f5ea}
.badge{padding:1px 8px;border-radius:10px;color:#fff;font-size:12px;white-space:nowrap}.b-수량변경{background:#d98e04}.b-규격변경{background:var(--down)}.b-삭제{background:var(--up)}.b-신규{background:var(--new)}
.kpi{display:flex;gap:12px;flex-wrap:wrap}.kpi div{flex:1;min-width:200px;background:#f7f9fd;border:1px solid var(--line);border-radius:8px;padding:10px 14px}
.kpi b{display:block;font-size:20px;color:var(--navy)}.pos{color:var(--up)!important}.neg{color:var(--down)!important}
.warn{background:#fff3cd;border:1px solid #f0d98a;padding:8px 12px;border-radius:6px;margin:6px 0;font-size:13px}
.err{background:#fdeaea;border-color:#e6a3a3}.ok{background:#e6f5ea;border-color:#9fd2ae}
#log{white-space:pre-wrap;font-size:12px;color:#556}
</style></head><body>
<header><h1>설계변경 도급내역서 생성 에이전트</h1><small id="proj"></small></header>
<main>
<div class="card"><h2>1. 설계변경 도면 범위</h2>
 <div class="row"><b>샘플 시나리오:</b><span id="samples"></span></div>
 <div class="grid"><div><label>층</label><div class="chips" id="floors"></div>
  <div class="row" style="margin-top:6px"><button class="sec" onclick="selAll('floors',true)">전체</button><button class="sec" onclick="selAll('floors',false)">해제</button></div></div>
 <div><label>구역</label><div class="chips" id="zones"></div><label>공종</label><div class="chips" id="cats"></div></div></div>
 <p class="muted" id="scopeInfo"></p>
 <details><summary>범위에 해당하는 도면 목록</summary><div class="scroll"><table id="dwgTbl"></table></div></details>
</div>
<div class="card"><h2>2. 주요 변경사항</h2>
 <textarea id="change" placeholder="예) 5~7층 사무공간 천장을 시스템 천장에서 노출천장 내화도장으로 변경. 시공 면적은 기존 대비 약 8% 감소."></textarea>
 <div class="grid"><div><label>Claude API Key</label><input type="password" id="key" placeholder="sk-ant-..." autocomplete="off"></div>
 <div><label>모델</label><input type="text" id="model" value="claude-sonnet-5-5"></div></div>
 <p class="muted">키는 이 브라우저 탭(sessionStorage)에만 저장되며 api.anthropic.com 외로 전송되지 않습니다. 인터넷 연결이 필요합니다.</p>
 <div class="row"><button id="run" onclick="run()">도급내역서 생성</button><span id="status" class="muted"></span></div>
</div>
<div id="result"></div>
<div class="card"><details><summary>에이전트 처리 로그 (프롬프트/응답)</summary><div id="log"></div></details></div>
</main>

function calc(rows){
  const mat=rows.reduce((s,r)=>s+r.재료비,0),lab=rows.reduce((s,r)=>s+r.노무비,0),exp=rows.reduce((s,r)=>s+r.경비,0),d=mat+lab+exp;
  const ind=Math.round(lab*RATE.indLab),ins=Math.round(d*RATE.ins),gen=Math.round((d+ind+ins)*RATE.gen),prof=Math.round((lab+ind+exp+gen)*RATE.prof);
  const sup=d+ind+ins+gen+prof,vat=Math.round(sup*RATE.vat);
  return [["직접공사비",d],["간접노무비 (직노 12%)",ind],["보험·안전관리비 (3.5%)",ins],["일반관리비 (6%)",gen],["이윤 (10%)",prof],["공급가액",sup],["부가가치세 (10%)",vat],["도급금액",sup+vat]];
}
function mkRow(src,over){const r={...src,...over};r.재료비=Math.round(r.수량*r.재료비단가);r.노무비=Math.round(r.수량*r.노무비단가);r.경비=Math.round(r.수량*r.경비단가);r.합계=r.재료비+r.노무비+r.경비;return r}
const unit=r=>r.재료비단가+r.노무비단가+r.경비단가;

function inScope(r,s){return s.f.includes(r.층)&&s.z.includes(r.구역)&&s.c.includes(r.공종)}

const SYSTEM=`당신은 건설 도급내역서 설계변경 전문가입니다. 사용자가 제공한 [범위 내 내역서]와 [주요 변경사항]을 읽고 변경해야 할 내역 항목을 JSON으로만 출력합니다.
규칙:
1. 변경 구분은 수량변경 | 규격변경 | 삭제 | 신규 중 하나입니다.
   - 수량변경: 기존 항목의 수량만 바뀜(규격·단가 유지). 변경후.수량만 지정.
   - 규격변경: 기존 항목의 품명/규격이 바뀌고 단가가 바뀌는 경우(항목 유지). 변경후에 품명/규격과 단가 3종(재료비단가,노무비단가,경비단가)을 지정. 수량이 바뀌면 수량도 지정.
   - 삭제: 해당 항목 제거.
   - 신규: 새 항목 추가. 변경후에 공종,세부공종,층,구역,품명/규격,단위,수량,재료비단가,노무비단가,경비단가 모두 지정. 항목코드는 비워 둠.
2. 품목 자체가 다른 품목으로 교체되면 기존 항목은 '삭제', 대체 품목은 '신규'(동일 층·구역 기준)로 표현합니다.
3. 항목코드는 반드시 [범위 내 내역서]에 존재하는 값만 사용합니다. 범위 밖 항목은 절대 변경하지 않습니다.
4. 변경사항에 수치(증감률, 단가 등)가 있으면 그대로 적용합니다. 수치가 없어 단가를 새로 정해야 하면 유사 항목 단가를 참고해 합리적으로 추정하고 "추정":true 로 표시합니다.
5. 변경사항이 적용되는 모든 층·구역의 해당 항목을 빠짐없이 나열합니다(층/구역별 행이 각각 별도 항목입니다).
6. 수량은 소수 1자리, 단가는 원 단위 정수입니다.
출력 형식(JSON 외 텍스트 금지):
{"요약":"변경 내용 한두 문장","변경":[{"구분":"수량변경","항목코드":"A0001","변경후":{"수량":123.4},"근거":"짧은 설명","추정":false}]}`;

  const head="항목코드\t공종\t세부공종\t층\t구역\t품명/규격\t단위\t수량\t재료비단가\t노무비단가\t경비단가";
  const body=rows.map(r=>[r.항목코드,r.공종,r.세부공종,r.층,r.구역,r["품명/규격"],r.단위,r.수량,r.재료비단가,r.노무비단가,r.경비단가].join("\t")).join("\n");
  return `[변경 도면 범위]\n층: ${s.f.join(", ")}\n구역: ${s.z.join(", ")}\n공종: ${s.c.join(", ")}\n\n[범위 내 내역서] (${rows.length}행, TSV)\n${head}\n${body}\n\n[주요 변경사항]\n${text}`;
}
async function callClaude(prompt){
  const res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"content-type":"application/json","x-api-key":$("key").value.trim(),"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
    body:JSON.stringify({model:$("model").value.trim(),max_tokens:16000,system:SYSTEM,messages:[{role:"user",content:prompt}]})});
  const j=await res.json();if(!res.ok)throw new Error(j.error?.message||res.status);
  return j.content.filter(c=>c.type==="text").map(c=>c.text).join("");
}
function parseJSON(t){const a=t.indexOf("{"),b=t.lastIndexOf("}");if(a<0||b<0)throw new Error("JSON 응답을 찾지 못했습니다");return JSON.parse(t.slice(a,b+1))}

/* ---- 변경 적용 (결정적 계산) ---- */
function pick(v,all){const k=["수량","재료비단가","노무비단가","경비단가","품명/규격","단위","세부공종"];if(all)k.push("층","구역","공종");const o={};k.forEach(x=>{if(v[x]!==undefined)o[x]=v[x]});return o}
function apply(changes,scopeRows,s){
  const idx=new Map(BASE.map((r,i)=>[r.항목코드,i])),inS=new Set(scopeRows.map(r=>r.항목코드));
  const after=BASE.map(r=>({...r})),removed=new Set(),touched=new Set(),adds=[],log=[],warns=[];let seq=0;
  for(const c of changes){
    const o=c.항목코드&&idx.has(c.항목코드)?BASE[idx.get(c.항목코드)]:null,v=c.변경후||{};
    if(c.구분!=="신규"){
      if(!o||!inS.has(c.항목코드)){warns.push(`범위 밖/없는 항목코드 무시: ${c.항목코드} (${c.구분})`);continue}
      if(touched.has(c.항목코드)){warns.push(`중복 변경 무시: ${c.항목코드}`);continue}
      touched.add(c.항목코드);
    }
    if(c.구분==="삭제"){removed.add(c.항목코드);log.push({t:"삭제",o,n:null,c})}
    else if(c.구분==="수량변경"||c.구분==="규격변경"){
      const n=mkRow(o,pick(v));after[idx.get(c.항목코드)]=n;log.push({t:c.구분,o,n,c});
      if(c.구분==="수량변경"&&unit(n)!==unit(o))warns.push(`${c.항목코드}: 수량변경인데 단가가 달라졌습니다`);
    }else if(c.구분==="신규"){
      if(!v.층||!v.구역||!v.공종){warns.push("신규 항목에 층/구역/공종 누락 → 무시");continue}
      const n=mkRow({항목코드:`N-${String(++seq).padStart(3,"0")}`,구역설명:ZN[v.구역]||"",세부공종:"",단위:"",수량:0,재료비단가:0,노무비단가:0,경비단가:0,"품명/규격":""},pick(v,true));
      if(!inScope(n,s))warns.push(`${n.항목코드}: 신규 항목이 지정 범위 밖(${n.층}/${n.구역}/${n.공종})입니다`);
      adds.push(n);log.push({t:"신규",o:null,n,c});
    }else{warns.push(`알 수 없는 구분: ${c.구분}`);continue}
    if(c.추정)warns.push(`${c.항목코드||"신규"}: 단가/수량이 추정치입니다 — 검토 필요`);
  }
  return {after:after.filter(r=>!removed.has(r.항목코드)).concat(adds),log,warns};
}

/* ---- 실행 ---- */
async function run(){
  const s=curScope(),text=$("change").value.trim();
  if(!$("key").value.trim())return alert("API Key를 입력하세요");
  if(!text)return alert("주요 변경사항을 입력하세요");
  const rows=BASE.filter(r=>inScope(r,s));if(!rows.length)return alert("선택한 범위에 해당하는 내역이 없습니다");
  sessionStorage.k=$("key").value.trim();
  $("run").disabled=true;$("status").textContent="Claude가 변경안을 작성하는 중... (최대 1~2분)";$("result").innerHTML="";
  const prompt=buildPrompt(s,rows,text);$("log").textContent="[프롬프트]\n"+prompt.slice(0,3000)+(prompt.length>3000?"\n... (생략)":"");
  try{
    const out=await callClaude(prompt);$("log").textContent+="\n\n[응답]\n"+out;
    const j=parseJSON(out),r=apply(j.변경||[],rows,s);render(j,r);$("status").textContent="완료";
  }catch(e){$("result").innerHTML=`<div class="warn err">오류: ${e.message}</div>`;$("status").textContent=""}
  $("run").disabled=false;
}

function render(j,r){
  const b=calc(BASE),a=calc(r.after),diff=a[7][1]-b[7][1],cls=diff>0?"pos":diff<0?"neg":"";
  let h=`<div class="card"><h2>3. 설계변경 결과</h2><p>${j.요약||""}</p>
  <div class="kpi"><div>변경 전 도급금액<b>${won(b[7][1])}</b>원</div><div>변경 후 도급금액<b>${won(a[7][1])}</b>원</div><div>증감<b class="${cls}">${sg(diff)}</b>원 (${(diff/b[7][1]*100).toFixed(2)}%)</div><div>변경 항목<b>${r.log.length}</b>행</div></div>`;
  h+=r.warns.map(w=>`<div class="warn">⚠ ${w}</div>`).join("");
  const sm=window._sample;
  if(sm&&$("change").value.trim()===sm.주요변경사항){const d=diff-sm.정답증감;
    h+=`<div class="warn ${Math.abs(d)<=Math.abs(sm.정답증감)*0.02?"ok":""}">샘플 정답 대비: 정답 증감 ${sg(sm.정답증감)}원 / 에이전트 ${sg(diff)}원 / 차이 ${sg(d)}원</div>`}
  h+=`</div><div class="card"><h2>변경 내역 (변경 전·후 비교)</h2><div class="scroll" style="max-height:520px"><table><tr><th>구분<th>항목코드<th>층<th>구역<th>품명/규격(전)<th>품명/규격(후)<th>단위<th class=n>수량(전)<th class=n>수량(후)<th class=n>단가합(전)<th class=n>단가합(후)<th class=n>금액(전)<th class=n>금액(후)<th class=n>증감액<th>근거</tr>`;
  for(const l of r.log){const o=l.o,n=l.n,x=o||n,d=(n?n.합계:0)-(o?o.합계:0);
    h+=`<tr class="t-${l.t}"><td><span class="badge b-${l.t}">${l.t}</span><td>${o?o.항목코드:n.항목코드}<td>${x.층}<td>${x.구역}<td>${o?o["품명/규격"]:""}<td>${n?n["품명/규격"]:""}<td>${x.단위}<td class=n>${o?won(o.수량):0}<td class=n>${n?won(n.수량):0}<td class=n>${o?won(unit(o)):0}<td class=n>${n?won(unit(n)):0}<td class=n>${o?won(o.합계):0}<td class=n>${n?won(n.합계):0}<td class="n ${d>0?"pos":d<0?"neg":""}">${sg(d)}<td>${l.c.근거||""}${l.c.추정?" (추정)":""}`}
  h+=`</table></div></div><div class="card"><h2>원가계산서 비교</h2><table style="max-width:700px"><tr><th>비목<th class=n>변경 전<th class=n>변경 후<th class=n>증감</tr>`;
  b.forEach((x,i)=>{const d=a[i][1]-x[1];h+=`<tr><td>${x[0]}<td class=n>${won(x[1])}<td class=n>${won(a[i][1])}<td class="n ${d>0?"pos":d<0?"neg":""}">${sg(d)}`});
  $("result").innerHTML=h+"</table></div>";
}
</script></body></html>
